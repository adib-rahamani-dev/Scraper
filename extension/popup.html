<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>رادار لید</title><style>body{width:340px;background:#102131;color:#edf9f6;font:12px/1.8 Tahoma;margin:0;padding:16px;box-sizing:border-box}h1{font-size:19px;color:#71e1bd}h2{font-size:14px}form{border-top:1px solid #34515e;margin-top:12px;padding-top:8px}input,select,button{box-sizing:border-box;width:100%;padding:9px;border-radius:7px;margin:4px 0;font:12px Tahoma}input,select{background:#1b384b;color:white;border:1px solid #466474}button{background:#64d9b5;border:0;cursor:pointer}.secondary{background:#2a4557;color:white}.status{white-space:pre-wrap;color:#c0d2da}small{color:#a4bdc8}label{display:block}</style></head><body><h1>◉ رادار لید ۲</h1><small>مرورگر شخصی + پنل خصوصی + اکسل واقعی</small><form id="login"><h2>ورود با شمارهٔ خودت</h2><input name="phone" type="tel" autocomplete="tel" placeholder="0912…" required><select name="source"><option value="both">دیوار و شیپور</option><option value="divar">دیوار</option><option value="sheypoor">شیپور</option></select><button>بازکردن فرم و درخواست کد</button><small>کد تأیید را در برگهٔ رسمی سایت وارد کن. شمارهٔ ورود به سرور فرستاده نمی‌شود.</small></form><div class="status" id="login-state"></div><form id="search"><h2>جست‌وجو و استخراج جزئیات</h2><input name="topic" placeholder="موضوع؛ مثلاً موبایل" minlength="2" maxlength="80" required><select name="source"><option value="divar">دیوار</option><option value="sheypoor">شیپور</option></select><select name="city"><option value="iran">کل ایران</option><option value="tehran">تهران</option><option value="qazvin">قزوین</option><option value="karaj">کرج</option><option value="mashhad">مشهد</option><option value="isfahan">اصفهان</option><option value="shiraz">شیراز</option><option value="rasht">رشت</option><option value="tabriz">تبریز</option></select><input name="url" type="url" placeholder="لینک فیلترشدهٔ سایت (اختیاری)"><label>حداکثر آگهی بارگذاری‌شده<input name="limit" type="number" min="1" max="40" value="20"></label><button>جست‌وجو و بازکردن آگهی‌ها</button><small>برای فیلتر محله و دسته‌بندی، لینک جست‌وجوی فیلترشدهٔ خود سایت را بده یا از پنل شناور نتایج شروع کن.</small></form><div id="progress" class="status"></div><button id="resume" class="secondary">ادامهٔ اجرا</button><button id="stop" class="secondary">توقف</button><button id="dashboard" class="secondary">پنل و خروجی اکسل</button><button id="options" class="secondary">تنظیم اتصال لوکال / Vercel</button><div id="status" class="status" role="status"></div><script src="popup.js"></script></body></html>
